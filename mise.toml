#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27.1"

[tasks.list]
description = "List the fqdns allowed in the cluster"
usage = '''
flag "--format <format>" help="The format of the output" default="table"
flag "--kubeconfig <kubeconfig>" help="The path to the kubeconfig file" default="~/.kube/config"
'''
run = "go run main.go --format ${usage_format} --kubeconfig ${usage_kubeconfig}"
